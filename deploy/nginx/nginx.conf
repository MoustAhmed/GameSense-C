worker_processes auto;
events { worker_connections 4096; }

http {
  access_log off;

  # nginx resolves "ingest" to every replica's IP at startup and round-robins
  # across them. After scaling ingest, run: docker compose restart lb
  upstream ingest {
    server ingest:8080 max_fails=3 fail_timeout=5s;
    keepalive 256;
  }

  server {
    listen 8080;
    client_max_body_size 8m;

    location / {
      proxy_pass http://ingest;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_connect_timeout 2s;
      proxy_read_timeout 15s;
      # Retry another replica on connection failure, but never retry a POST
      # that may already have been processed upstream (that's the client's job,
      # and its retries are safe thanks to idempotency keys).
      proxy_next_upstream error;
    }
  }
}
