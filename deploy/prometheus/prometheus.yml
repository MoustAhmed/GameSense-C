global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # DNS discovery finds every replica of a Compose service.
  - job_name: ingest
    dns_sd_configs: [{names: [ingest], type: A, port: 8080}]
  - job_name: worker
    dns_sd_configs: [{names: [worker], type: A, port: 9102}]
  - job_name: simulator
    static_configs: [{targets: ["simulator-0:9101", "simulator-1:9101"]}]
  - job_name: auditor
    static_configs: [{targets: ["auditor:9103"]}]
  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs: [{targets: ["redpanda-0:9644", "redpanda-1:9644", "redpanda-2:9644"]}]
